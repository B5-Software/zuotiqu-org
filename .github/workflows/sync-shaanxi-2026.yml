name: Sync official Shaanxi 2026 score-rank tables

on:
  push:
    paths:
      - scripts/import-shaanxi-2026.py
      - .github/workflows/sync-shaanxi-2026.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate official 2026 tables
        run: python scripts/import-shaanxi-2026.py
      - name: Commit only validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/gaokao/shaanxi/2026-ranks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: synchronize Shaanxi 2026 official score ranks [skip ci]"
            git push origin HEAD:main
          fi
